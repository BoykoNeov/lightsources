# Fused silica (quartz glass): refractive index n and extinction coefficient k.
#
# Source: D. Franta, D. Nečas, I. Ohlídal, A. Giglia, "Optical characterization of SiO2
#   thin films using universal dispersion model over wide spectral range", Proc. SPIE
#   9890, 989014 (2016), doi:10.1117/12.2227580; fused silica plate (SCHOTT Lithosil Q2),
#   0.405 mm, room temperature. Taken from the refractiveindex.info database (CC0),
#   database/data/main/SiO2/nk/Franta.yml, downloaded 2026-10-14; 0.24-2.6 um kept,
#   thinned where k is zero (every 25th point) and in the bands (every 2nd point);
#   k below 1e-12 set to 0. Thinning moves the 1 mm transmittance by < 1e-3.
#
# Over 0.24-2.6 um the glass itself does not absorb: k is zero apart from the bands of
# water (OH) in the glass, near 1.38 um (1.3 % through 1 mm) and 2.22 um (5.3 %). Their
# strength is set by the water content, which differs between quartz glasses by orders
# of magnitude (synthetic "wet" silica has ~1000 ppm OH, fused natural quartz for lamps
# ~10-30 ppm). The lamp's own quartz is not specified; this sample's bands are kept as
# an upper estimate. At the NIST lamp's table wavelengths they reach 1.3 % at most.
#
# n(lambda) = n0 + a * lambda^2 + b * lambda^-2, lambda in um: least-squares fit to the
# tabulated n over 0.24-2.6 um, within 0.003 (n is not used on the quick path).
# Internal transmittance of a wall d thick: exp(-4 pi k d / lambda).

id: fused-silica-franta
name: fused silica (Franta 2016)
range_um: [0.24, 2.60]
n_formula: {n0: 1.44986, a: -0.003112, b: 0.003477}
