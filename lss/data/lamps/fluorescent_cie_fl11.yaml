id: fluorescent_cie_fl11
name: Three-band fluorescent lamp, 4000 K (CIE FL11)
family: fluorescent
reference: cie-fl11

# The tube. The CIE table was measured through it, so models are scored after it
# (quick path, lss/lamp/envelope.py). Its iron absorption takes ~3 % at 780 nm and
# ~1 % in the green, enough to move the colour by du'v' ~4e-4.
envelope:
  material: soda-lime-rubin-clear
  wall_thickness:
    value: 0.8
    unit: mm
    source: >-
      typical: T8/T12 fluorescent tube walls are 0.5-1.1 mm (US 10,920,972 B2, a glass
      tube built to T8/T12 dimensions). That range moves a score by du'v' ~1.6e-4
      (tests/test_envelope.py).

physical:
  gas_temperature:
    value: 320
    unit: K
    source: >-
      typical value, not checked against a source: a tube runs with its coldest spot
      near 40 C, where the Hg vapour pressure gives the most light, and the gas is
      somewhat hotter. It sets only the Doppler width of the Hg lines (~0.0004 nm),
      far below the 5 nm reference tables, so even a large error does not matter.

models:
  0: {generator: reference}
  1:
    # Visible Hg lines in measured ratios plus the tri-phosphor blend: blue BAM:Eu2+,
    # green LaPO4:Ce,Tb (LAP), red Y2O3:Eu (YOX). Their shapes are shared by every
    # lamp (lss/data/phosphors.yaml); this lamp sets only its mix, relative to the
    # green phosphor's power.
    generator: fluorescent_triband
    params:
      hg_to_green:
        value: 0.457525
        unit: "1"
        empirical: true
        reason: >-
          fitted by `lss fit` (spectral objective) to cie-fl11, jointly with cie-fl10,
          cie-fl11, cie-fl12 on 2026-10-14: NRMS 5.98e-02, du'v' 5.9e-04, dCCT +1.04 K
        bounds: [0.001, 1]
      blue_to_green:
        value: 0.52559
        unit: "1"
        empirical: true
        reason: >-
          fitted by `lss fit` (spectral objective) to cie-fl11, jointly with cie-fl10,
          cie-fl11, cie-fl12 on 2026-10-14: NRMS 5.98e-02, du'v' 5.9e-04, dCCT +1.04 K
        bounds: [0.01, 5]
      red_to_green:
        value: 1.06583
        unit: "1"
        empirical: true
        reason: >-
          fitted by `lss fit` (spectral objective) to cie-fl11, jointly with cie-fl10,
          cie-fl11, cie-fl12 on 2026-10-14: NRMS 5.98e-02, du'v' 5.9e-04, dCCT +1.04 K
        bounds: [0.05, 5]
