id: halogen_nist_fel_f455
name: 1000 W quartz-halogen lamp, FEL type, NIST-calibrated (F-455)
family: incandescent
reference: nist-fel-f455

# A measured lamp (lss/data/nist_fel.yaml): a coiled-coil tungsten filament in a quartz
# tube with a halogen fill, run on DC at 8.200 A and 109.4 V. Unlike Illuminant A it is
# real tungsten, so a better tungsten model should score better against it.
#
# Every level is fitted with the uncertainty objective: each of the table's wavelengths
# weighted by NIST's stated uncertainty there. The default (spectral) objective weights
# them by the mean level instead, so the bright IR outvotes the dim violet and UV. Each
# node's total uncertainty is treated as independent, which is generous as a test of
# shape (design §4.1 L3).

envelope:
  material: fused-silica-franta
  wall_thickness:
    # Hardly matters: fused silica only absorbs in its water bands here (1.3 % at most
    # at the table's wavelengths for 1 mm, and that is an upper estimate).
    value: 1.0
    unit: mm
    empirical: true
    reason: typical wall of a T6 quartz-halogen tube; the calibration report does not state it

physical:
  filament_temperature:
    # The true temperature of a coiled filament (Level 3, with the coil's cavity effect).
    # In De Vos's extrapolated range (measured to 2800 K), which every level-3 sheet flags.
    value: 3091.21
    unit: K
    empirical: true
    reason: >-
      fitted by `lss fit` (uncertainty objective, with coil_open_fraction) to nist-fel-f455
      on 2026-10-14: NRMS 1.04e-02, du'v' 1.7e-04, dCCT -4.75 K, chi2/node 0.71
    # Halogen lamps run up to ~3300 K; 3200 K is also where the De Vos emissivity,
    # extrapolated, stops being defined.
    bounds: [2600, 3200]
  coil_open_fraction:
    value: 0.296894
    unit: "1"
    empirical: true
    reason: >-
      fitted by `lss fit` (uncertainty objective, with filament_temperature) to nist-fel-f455
      on 2026-10-14: NRMS 1.04e-02, du'v' 1.7e-04, dCCT -4.75 K, chi2/node 0.71
    # 1 is a flat surface (no cavity effect); below ~0.05 the coil would be a near-closed
    # cavity, which a coil whose turns are spaced by about a wire diameter is not.
    bounds: [0.05, 1.0]

models:
  0: {generator: reference}
  1:
    generator: planck
    params:
      filament_temperature:
        # A blackbody's temperature: no physical meaning beyond "the best Planck curve".
        value: 3130.59
        unit: K
        empirical: true
        reason: >-
          fitted by `lss fit` (uncertainty objective) to nist-fel-f455 on 2026-10-14: NRMS
          1.06e-01, du'v' 2.5e-04, dCCT -0.39 K, chi2/node 73.42
        bounds: [2600, 3600]
  2:
    generator: tungsten
    params:
      filament_temperature:
        # A flat-ribbon emissivity on a coiled filament: too blue a shape, so the fitted
        # temperature drops ~45 K below Level 3's to compensate.
        value: 3046.04
        unit: K
        empirical: true
        reason: >-
          fitted by `lss fit` (uncertainty objective) to nist-fel-f455 on 2026-10-14: NRMS
          7.14e-02, du'v' 6.5e-04, dCCT -15.62 K, chi2/node 33.92
        bounds: [2600, 3200]
  3: {generator: tungsten_coil}
