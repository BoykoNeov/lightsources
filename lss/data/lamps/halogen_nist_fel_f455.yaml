id: halogen_nist_fel_f455
name: 1000 W quartz-halogen lamp, FEL type, NIST-calibrated (F-455)
family: incandescent
reference: nist-fel-f455

# A measured lamp (lss/data/nist_fel.yaml): a coiled-coil tungsten filament in a quartz
# tube with a halogen fill, run on DC at 8.200 A and 109.4 V. Unlike Illuminant A it is
# real tungsten, so a better tungsten model should score better against it.
#
# Every level is fitted with the uncertainty objective: each of the table's wavelengths
# weighted by NIST's stated uncertainty there. The default (spectral) objective weights
# them by the mean level instead, so the bright IR outvotes the dim violet and UV. Each
# node's total uncertainty is treated as independent, which is generous as a test of
# shape (design §4.1 L3).

envelope:
  material: fused-silica-franta
  wall_thickness:
    # Hardly matters: fused silica only absorbs in its water bands here (1.3 % at most
    # at the table's wavelengths for 1 mm, and that is an upper estimate).
    value: 1.0
    unit: mm
    empirical: true
    reason: typical wall of a T6 quartz-halogen tube; the calibration report does not state it

physical:
  filament_temperature:
    # The true temperature of a coiled filament (Level 3, with the coil's cavity effect).
    # In De Vos's extrapolated range (measured to 2800 K), which every level-3 sheet flags.
    value: 3091.21
    unit: K
    empirical: true
    reason: >-
      fitted by `lss fit` (uncertainty objective, with coil_open_fraction) to nist-fel-f455
      on 2026-10-14: NRMS 1.04e-02, du'v' 1.7e-04, dCCT -4.75 K, chi2/node 0.71
    # Halogen lamps run up to ~3300 K; 3200 K is also where the De Vos emissivity,
    # extrapolated, stops being defined.
    bounds: [2600, 3200]
  coil_open_fraction:
    value: 0.296894
    unit: "1"
    empirical: true
    reason: >-
      fitted by `lss fit` (uncertainty objective, with filament_temperature) to nist-fel-f455
      on 2026-10-14: NRMS 1.04e-02, du'v' 1.7e-04, dCCT -4.75 K, chi2/node 0.71
    # 1 is a flat surface (no cavity effect); below ~0.05 the coil would be a near-closed
    # cavity, which a coil whose turns are spaced by about a wire diameter is not.
    bounds: [0.05, 1.0]

  # The operating point (Level 4). NIST set the current; the voltage it recorded "for
  # reference only", without saying where on the lamp it was taken, so how much lead,
  # seal and contact resistance the hot resistance (voltage over current) includes is
  # unknown (design §4.1 L4: it may be what separates the two lamps).
  lamp_current:
    value: 8.200
    unit: A
    source: NIST Report of Calibration 39045C, lamp F-455 (test 844/257096-96-1), DC
  lamp_voltage:
    value: 109.4
    unit: V
    source: NIST Report of Calibration 39045C, lamp F-455 (test 844/257096-96-1), "for reference only"
  cold_resistance:
    # At 293 K. Neither NIST report nor any FEL datasheet found (2026-10-15) states it, nor
    # the wire's dimensions, so it is fitted: the resistance at which tungsten's
    # resistivity puts the filament at the temperature the spectrum shows.
    value: 0.733126
    unit: ohm
    empirical: true
    reason: >-
      fitted by `lss fit` (uncertainty objective, with coil_open_fraction) to nist-fel-f455
      on 2026-10-15: NRMS 1.04e-02, du'v' 1.7e-04, dCCT -4.75 K, chi2/node 0.71; puts the
      filament at 3091.2 K, Level 3's temperature
    # Inside the range the spectral emissivity reaches (to 3200 K, extrapolated) for both of
    # Level 4's steps: from the resistance (13.3-13.4 ohm hot) the bounds give 3175-3185 K
    # and 2875-2885 K; from the power balance at 8.200 A, 3056 K and 3191 K.
    bounds: [0.71, 0.80]

  # The power balance (Level 4, second step): the current alone sets the temperature, and
  # the voltage becomes a prediction (design §4.1 L4).
  filament_wire_area:
    # The wire's whole surface, hot (about 3 % above its room-temperature size). Solved,
    # not measured: the surface at which the losses at Level 3's 3091.2 K equal NIST's
    # I x V = 897.1 W. With the cold resistance it implies a wire about 0.29 mm thick and
    # 0.92 m long (1-2 % off, since the resistance is at room-temperature dimensions).
    value: 8.36793e-4
    unit: m2
    empirical: true
    reason: >-
      solved by lss.physics.thermal.balance.solve_area from nist-fel-f455's 8.200 A,
      109.4 V and the cold resistance and open fraction above, with gas_loss_share 0.10
      (2026-10-15); the voltage's lead and contact resistance, if any, put it slightly high
  gas_loss_share:
    # Heat carried off by the fill gas and conducted into the supports, as a share of the
    # input power at 3000 K. No source found for these lamps (fill gas, pressure and coil
    # size unknown); 0.10 is a round guess. It does not change the lamp at its own
    # current, only how it follows a change of current. NIST's measured "about 0.06 %/mA"
    # does not usefully bound it: the cut-off is 0.10-0.19 depending on how its one digit
    # is read (design §4.1 L4).
    value: 0.10
    unit: "1"
    empirical: true
    reason: round guess; not stated for FEL lamps; NIST's one-digit 0.06 %/mA does not usefully bound it
  gas_loss_exponent:
    value: 2.0
    unit: "1"
    empirical: true
    reason: >-
      d ln P_gas / d ln T near 3100 K from Langmuir's sheath model with conductivity rising
      as T^0.75 and a wall near 900 K; the fill gas is not stated

models:
  0: {generator: reference}
  1:
    generator: planck
    params:
      filament_temperature:
        # A blackbody's temperature: no physical meaning beyond "the best Planck curve".
        value: 3130.59
        unit: K
        empirical: true
        reason: >-
          fitted by `lss fit` (uncertainty objective) to nist-fel-f455 on 2026-10-14: NRMS
          1.06e-01, du'v' 2.5e-04, dCCT -0.39 K, chi2/node 73.42
        bounds: [2600, 3600]
  2:
    generator: tungsten
    params:
      filament_temperature:
        # A flat-ribbon emissivity on a coiled filament: too blue a shape, so the fitted
        # temperature drops ~45 K below Level 3's to compensate.
        value: 3046.04
        unit: K
        empirical: true
        reason: >-
          fitted by `lss fit` (uncertainty objective) to nist-fel-f455 on 2026-10-14: NRMS
          7.14e-02, du'v' 6.5e-04, dCCT -15.62 K, chi2/node 33.92
        bounds: [2600, 3200]
  3: {generator: tungsten_coil}
  4:
    generator: tungsten_balance
    params:
      coil_open_fraction:
        # Level 3's value, held fixed here (no bounds, so `lss fit` leaves it alone): the
        # wire surface was solved for it, and with the surface fixed the open fraction
        # alone would swing the filament from 2550 K (f = 1) to past 3400 K (f = 0.2).
        value: 0.296894
        unit: "1"
        empirical: true
        reason: >-
          Level 3's open fraction, fitted by `lss fit` (uncertainty objective, with
          filament_temperature) to nist-fel-f455 on 2026-10-14; held fixed at Level 4
