id: incandescent_cie_a
name: Gas-filled tungsten lamp at 2856 K (CIE Illuminant A)
family: incandescent
reference: cie-a

# 2856 K is Illuminant A's *distribution temperature*: the blackbody whose colour
# matches the lamp. Real tungsten is bluer than a blackbody at the same temperature
# (its emissivity falls with wavelength), so the filament itself is cooler.
physical:
  filament_temperature:
    # A calibration against a definition, not a test: Illuminant A is a blackbody
    # curve, which tungsten cannot match in both shape and colour. Colour is what A
    # defines, so colour is matched; a spectral fit would give 2774.5 K (NRMS 0.8 %)
    # at the cost of a colour 25 K cooler.
    value: 2799.83
    unit: K
    empirical: true
    reason: >-
      true filament temperature, fitted by `lss fit` (colour objective) to cie-a on
      2026-10-14: NRMS 2.03e-02, du'v' 3.2e-04, dCCT +1.79 K
    # Plausible for a gas-filled general-service filament (vacuum lamps run near
    # 2400 K, halogen up to ~3300 K); the top is also where the De Vos emissivity,
    # extrapolated, stops being defined.
    bounds: [2400, 3200]

models:
  0: {generator: reference}
  1:
    generator: planck   # a blackbody: its temperature is the distribution temperature
    params:
      filament_temperature:
        value: 2856
        unit: K
        source: "CIE 15:2018 / ISO 11664-2: distribution temperature defining Illuminant A"
  2: {generator: tungsten}  # De Vos emissivity x Planck at the true filament temperature
