id: led_cie_b3
name: Phosphor-converted blue LED (CIE LED-B3)
family: led
reference: cie-led-b3

# Level 1's pump band is the blue that leaks out, so it is Level 1's own; Level 2
# derives it from the die and the phosphor layer. Widths follow the
# convention in lss/physics/led/bands.py: measured on the per-energy shape, in nm.
physical:
  # The blue die (read by Level 2; Level 1 fits the leaked blue as its own pump band).
  die_peak:
    value: 454.59
    unit: nm
    empirical: true
    reason: >-
      fitted by `lss fit` (spectral objective) to cie-led-b3, jointly with cie-led-b1,
      cie-led-b2, cie-led-b3, cie-led-b4, cie-led-b5 on 2026-10-18: NRMS 3.20e-02, du'v'
      4.5e-04, dCCT -19.11 K
    # InGaN pump dies for white LEDs ("royal blue") are made at about 440-460 nm; this is
    # the centre of the die's disorder-broadened band, before its blue Boltzmann tail.
    bounds: [435, 470]
  die_fwhm:
    value: 19.0415
    unit: nm
    empirical: true
    reason: >-
      fitted by `lss fit` (spectral objective) to cie-led-b3, jointly with cie-led-b1,
      cie-led-b2, cie-led-b3, cie-led-b4, cie-led-b5 on 2026-10-18: NRMS 3.20e-02, du'v'
      4.5e-04, dCCT -19.11 K
    # Blue InGaN emitters are typically 18-25 nm wide; the margin allows broader dies.
    bounds: [12, 35]
  die_tail_temperature:
    value: 377.203
    unit: K
    empirical: true
    reason: >-
      fitted by `lss fit` (spectral objective) to cie-led-b3, jointly with cie-led-b1,
      cie-led-b2, cie-led-b3, cie-led-b4, cie-led-b5 on 2026-10-18: NRMS 3.20e-02, du'v'
      4.5e-04, dCCT -19.11 K
    # The slope of the die's short-wavelength tail, exp(-dE/kT), written as a temperature.
    # A shape parameter, not the junction temperature: with the phosphor's temperature
    # free as well, the warm LEDs' fits push it below room temperature (design doc §4.2).
    bounds: [300, 420]
  phosphor_temperature:
    value: 300.026
    unit: K
    empirical: true
    reason: >-
      held at the single temperature the 2026-10-14 joint fit gave the die tail and the
      phosphors together, when the two were split (2026-10-15); not fitted on its own: the
      CIE tables leave it anywhere from 200 to 500 K (design doc §4.2)
    # Sets the phosphors' phonon widths.

  # Level 2's layer (read by Levels 2 and 3): this lamp's garnet composition and how much of
  # each phosphor the light crosses.
  garnet_zero_phonon:
    value: 21011.2
    unit: cm-1
    empirical: true
    reason: >-
      fitted by `lss fit` (spectral objective) to cie-led-b3, jointly with cie-led-b1,
      cie-led-b2, cie-led-b3, cie-led-b4, cie-led-b5 on 2026-10-18: NRMS 3.20e-02, du'v'
      4.5e-04, dCCT -19.11 K
    # Ce3+ zero-phonon line: 20450 cm-1 in YAG (Bachmann et al., Chem. Mater. 21, 2077
    # (2009)); Lu and Ga raise it (greener), Gd lowers it (more orange).
    bounds: [19500, 22000]
  garnet_optical_depth:
    value: 0.99095
    unit: "1"
    empirical: true
    reason: >-
      fitted by `lss fit` (spectral objective) to cie-led-b3, jointly with cie-led-b1,
      cie-led-b2, cie-led-b3, cie-led-b4, cie-led-b5 on 2026-10-18: NRMS 3.20e-02, du'v'
      4.5e-04, dCCT -19.11 K
    # Along the normal, at the garnet's absorption peak.
    bounds: [0, 8]
  nitride_optical_depth:
    value: 0.296391
    unit: "1"
    empirical: true
    reason: >-
      fitted by `lss fit` (spectral objective) to cie-led-b3, jointly with cie-led-b1,
      cie-led-b2, cie-led-b3, cie-led-b4, cie-led-b5 on 2026-10-18: NRMS 3.20e-02, du'v'
      4.5e-04, dCCT -19.11 K
    # Along the normal, on the nitride's blue absorption plateau.
    bounds: [0, 4]

models:
  0: {generator: reference}
  1:
    # One asymmetric phosphor band. FINDING: the fitted band is lopsided the wrong
    # way, wider on the blue side (80 nm, at its bound) than on the red side (71 nm),
    # whereas one Ce3+ band has its longer tail to the red (led_cie_b5: 66 vs 77 nm).
    # The fit is also short in the cyan valley (~500 nm) and around 600 nm. A
    # neutral-white LED like this one uses a blend of phosphors (yellow-green garnet
    # plus a red nitride), which one band cannot imitate. A second band
    # with free shape did not fix it cleanly (its peaks ran to their bounds), so the
    # next rung is Level 2's phosphor blend: garnet plus red nitride (below).
    generator: led_two_band
    params:
      pump_peak:
        value: 448.539
        unit: nm
        empirical: true
        reason: >-
          fitted by `lss fit` (spectral objective) to cie-led-b3 on 2026-10-14: NRMS 8.09e-02,
          du'v' 2.3e-03, dCCT +29.97 K
        # InGaN pump dies for white LEDs ("royal blue") are made at about 440-460 nm.
        bounds: [435, 470]
      pump_fwhm:
        value: 24.4351
        unit: nm
        empirical: true
        reason: >-
          fitted by `lss fit` (spectral objective) to cie-led-b3 on 2026-10-14: NRMS 8.09e-02,
          du'v' 2.3e-03, dCCT +29.97 K. At the wide end of the 18-25 nm usual for
          InGaN, after scoring through the table's 5 nm bandpass took ~1 nm off it.
        # Blue InGaN emitters are typically 18-25 nm wide; the margin allows broader dies.
        bounds: [12, 35]
      phosphor_peak:
        value: 599.013
        unit: nm
        empirical: true
        reason: >-
          fitted by `lss fit` (spectral objective) to cie-led-b3 on 2026-10-14: NRMS 8.09e-02,
          du'v' 2.3e-03, dCCT +29.97 K
        # From green LuAG:Ce (~520 nm) to a red-shifted garnet or blend centre (~650 nm).
        bounds: [520, 650]
      phosphor_half_width_short:
        value: 80
        unit: nm
        empirical: true
        reason: >-
          fitted by `lss fit` (spectral objective) to cie-led-b3 on 2026-10-14: NRMS 8.09e-02,
          du'v' 2.3e-03, dCCT +29.97 K; at its upper bound (see the finding above)
        # One Ce3+ garnet band has its longer tail to the red, so this is the narrower
        # of its two half widths; 80 nm is generous.
        bounds: [20, 80]
      phosphor_half_width_long:
        value: 70.9016
        unit: nm
        empirical: true
        reason: >-
          fitted by `lss fit` (spectral objective) to cie-led-b3 on 2026-10-14: NRMS 8.09e-02,
          du'v' 2.3e-03, dCCT +29.97 K
        # Ce3+ garnets have the longer tail on the red side, ~60-80 nm.
        bounds: [30, 120]
      phosphor_to_pump:
        value: 5.99174
        unit: "1"
        empirical: true
        reason: >-
          fitted by `lss fit` (spectral objective) to cie-led-b3 on 2026-10-14: NRMS 8.09e-02,
          du'v' 2.3e-03, dCCT +29.97 K
        # Converted to leaked radiant power: from a bluish cool white to deep warm white.
        bounds: [0.5, 30]
  2:
    # The die's blue light through a layer of a Ce3+ garnet and a red Eu2+ nitride
    # (lss/physics/led/layer.py): the leaked blue, the garnet-to-nitride balance and the
    # nitride's take of the garnet's green follow from how much of each the light crosses.
    # The phosphor constants are shared (lss/data/phosphors.yaml); the physical description
    # sets this lamp's garnet composition and the two optical depths. The layer does not scatter, so
    # the depths are effective values.
    generator: led_phosphor_layer
