# Sodium atom pairs (Na2): the curves that set the far wings of the D lines in a dense
# sodium arc (design §4.4, rung 2, first part: Na-Na only).
#
# Lower curves, X 1Sigma_g+ and a 3Sigma_u+ (the two ways two ground-state atoms meet):
#   S. Knoop, T. Schuster, R. Scelle, A. Trautmann, J. Appmeier, M. K. Oberthaler,
#   E. Tiesinga and E. Tiemann, "Feshbach spectroscopy and analysis of the interaction
#   potentials of ultracold sodium", Phys. Rev. A 83, 042704 (2011), arXiv:1102.0572,
#   Tables III and IV: analytic potentials fitted to spectroscopy, Feshbach resonances
#   and photoassociation. cm-1 relative to the 3s+3s asymptote, R in Angstrom.
#   The a-state form is fitted for R >= R_inn = 4.278 A (8.08 a0); inside it the paper
#   only continues it smoothly (u1 + u2/R^6), which runs about 1000 cm-1 below the
#   ab initio curve at 5-6.5 a0. There the a state is taken from Chung et al.'s Fig. 2(a)
#   instead (`a_state_inner_cm1`, below), whose inner part is Gutowski's ab initio curve.
#
# Upper curves, as difference potentials (transition energy against R):
#   H.-K. Chung, K. Kirby and J. F. Babb, "Theoretical study of the absorption spectra of
#   the sodium dimer", Phys. Rev. A 63, 032516 (2001), arXiv:physics/0008060, Figs. 1 and
#   2. Not tabulated in the paper: digitised here (2026-10-15) from the vector paths of
#   the arXiv PDF, so they are the curves the paper plots, at its plotting resolution.
#   Panel (b) gives V_A - V_X and V_B - V_X (Fig. 1) and V_b - V_a and V_c - V_a (Fig. 2)
#   between 12 000 (10 000) and 20 000 cm-1; where panel (b) is clipped, the difference
#   of the panel (a) curves is used. Check: the digitised X curve matches Knoop et al.'s
#   within 27-66 cm-1 rms from 5 to 24 a0 (255 cm-1 on the steep inner wall at 4-5 a0,
#   where 0.02 a0 is 200 cm-1). Chung et al. label the triplet upper states b 3Sigma_g+
#   and c 3Pi_g (not the usual b 3Pi_u). Beyond 24 a0 each difference potential is the
#   resonance long-range form asymptote + c3/R^3 (c3 below, from Chung et al. Sec. III).
#   Vacuum wavenumbers, cm-1, on R = 4.20, 4.25, ... 24.00 a0.
#
# Transition dipoles: Chung et al. Sec. III F give the singlet functions' long-range
#   forms D(R) = a + b/R^3 (atomic units; a matched to the ab initio short-range values,
#   b from Marinescu & Dalgarno). Inside 12 a0 the paper uses ab initio functions
#   (Stevens et al. 1977) that are not open; here the form is used at every R, or held
#   at its asymptote a (`dipole: constant`). The two bracket the 1000 K red wing of the
#   paper's Fig. 6 (see design §4.4). The triplet functions (Konowalow et al.) are not
#   given; each triplet band takes the singlet form of the same symmetry change
#   (Sigma-Sigma: a -> b like X -> A; Sigma-Pi: a -> c like X -> B), an assumption.
#   One measurement is open: Ahmed et al., J. Chem. Phys. 124, 084308 (2006), the X-A
#   moment 9.72 D (3.82 a.u.) at 4.81 A (9.09 a0), between the two forms there
#   (3.97 and 3.59 a.u.).

