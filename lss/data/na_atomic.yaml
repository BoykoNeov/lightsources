# Neutral sodium (Na I): energy levels, the resonance lines and the lines ending on 3p
# (design §4.4, §4.6).
#
# Source: NIST Atomic Spectra Database, version 5.12 (A. Kramida, Yu. Ralchenko, J. Reader
#   and NIST ASD Team), https://physics.nist.gov/asd, retrieved 2026-10-15.
#   Levels: all 2p6.nl levels of Na I (the valence series), with the first ionisation
#   limit. Levels NIST marks as derived rather than observed ([...] in its tables) are
#   flagged `derived`; they only matter for the partition function above 6000 K.
#   Lines: air wavelengths (observed), transition probabilities A_ki with NIST's
#   accuracy grade (AA <= 1 %, A+ <= 2 %, A <= 3 %, B+ <= 7 %, B <= 10 %), level
#   energies and statistical weights.
#
# Broadening constants (for lss/physics/hid/broadening.py):
#   Self (resonance) broadening: J. Huennekens and A. Gallagher, "Self-broadening of the
#   sodium resonance lines and excitation transfer between the 3P3/2 and 3P1/2 levels",
#   Phys. Rev. A 27, 1851 (1983), abstract and §II: the impact-regime Lorentzian full
#   width at half maximum, in angular frequency, is Gamma = k_br * N(Na ground), with
#   k_br = 4.67e-7 cm3/s for D2 and 3.07e-7 cm3/s for D1, each +-15 %, measured at
#   about 300 C. Impact theory makes it independent of temperature.
#   It is the width of the 3p level: a ground-state perturber couples resonantly to the
#   emitter's 3p level only (the emitter's 3s level would need an excited perturber), and
#   each fine-structure level keeps its own rate (§II: for well-isolated states only the
#   3P3/2 levels affect D2's broadening). So a line whose lower level is 3p_J carries
#   that level's D-line constant; resonance broadening has been measured on such lines
#   for that reason (§I: "transitions whose lower level is the resonance state").
#   Lines from 3p1/2 take D1's constant, lines from 3p3/2 D2's. Their upper levels have
#   no resonance partner among ground-state atoms.
#
#   Stark broadening by electrons: STARK-B database (S. Sahal-Bréchot, M. S. Dimitrijević
#   and N. Moreau, https://stark-b.obspm.fr, retrieved 2026-10-15; Observatory of Paris,
#   LERMA and Astronomical Observatory of Belgrade), dataset "Na I, method SCP", from
#   M. S. Dimitrijević and S. Sahal-Bréchot, JQSRT 34, 149 (1985); JQSRT 44, 421 (1990);
#   Bull. Obs. Astron. Belgrade 142, 59 (1990). Semiclassical perturbation theory, impact
#   approximation, isolated lines. Per multiplet: full width at half maximum w and shift
#   d (positive to the red) in Å at the multiplet's mean wavelength, at electron
#   densities 1e14, 1e15 and 1e16 cm-3 and temperatures 2500, 5000 and 10000 K. Every
#   component of a multiplet has w_line = w * (lambda_line / lambda_mult)^2, i.e. the
#   same width in frequency. w and d are not proportional to the density for the 3p-nd
#   lines (4d: 9 %, 5d: 26 % less per electron at 1e16 than at 1e15), so the code
#   interpolates per electron in density as well as temperature. C: the isolated-line
#   approximation holds for N < C/w (at the 1e16 cm-3 row). The STARK-B values are
#   theory. Griem states about 30 % for such calculations (as quoted by Miokovic et al.,
#   arXiv physics/0410146 (2004), whose +-25 % measurements in Na-Hg arcs agree for 7s
#   and the 5d shift, and differ slightly for 5s and 6s); for the D lines Konjevic et al.
#   (J. Phys. Chem. Ref. Data 31, 819 (2002)) report measured widths 13 % above these
#   values, and these shifts 40 % above measured ones. Ion (quasi-static)
#   broadening is not included in w, and STARK-B gives no ion parameter for Na I.
#
#   Line set: every multiplet with lower level 3p that STARK-B tabulates at 1e16 cm-3,
#   an HPS axis's electron density (3p-3d, 4d, 5d, 4s, 5s, 6s, 7s). Higher ones (3p-6d at
#   466.9 nm and up) stop being isolated lines below that density and are left out.

source: "NIST ASD v5.12, retrieved 2026-10-15"
ionisation_limit_cm1: 41449.451  # Na II 2p6 1S0, NIST ASD (uncertainty 0.002 cm-1)
ion_ground_g: 1  # Na II 2p6 1S0; its first excited level is above 30 eV

