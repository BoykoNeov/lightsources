# Stark broadening by electrons, STARK-B (header). Rows: electron density; columns:
# temperature. width: FWHM, shift: positive to the red, both in Å at the multiplet's
# mean wavelength. c: STARK-B's C at 1e16 cm-3, in Å cm-3 (isolated lines for N < C/w).
stark:
  electron_density_cm3: [1.0e+14, 1.0e+15, 1.0e+16]
  temperature_k: [2500, 5000, 10000]
  multiplets:
    3s-3p:
      wavelength_angstrom: 5891.8
      c_angstrom_cm3: 3.0e+19
      width_angstrom:
        - [1.910e-4, 2.110e-4, 2.490e-4]
        - [1.910e-3, 2.110e-3, 2.490e-3]
        - [1.910e-2, 2.110e-2, 2.490e-2]
      shift_angstrom:
        - [1.320e-4, 1.550e-4, 1.780e-4]
        - [1.320e-3, 1.550e-3, 1.780e-3]
        - [1.300e-2, 1.540e-2, 1.770e-2]
    3p-3d:
      wavelength_angstrom: 8191.1
      c_angstrom_cm3: 7.4e+18
      width_angstrom:
        - [3.120e-3, 3.550e-3, 3.850e-3]
        - [3.120e-2, 3.550e-2, 3.850e-2]
        - [3.120e-1, 3.550e-1, 3.850e-1]
      shift_angstrom:
        - [2.280e-3, 2.470e-3, 2.470e-3]
        - [2.260e-2, 2.460e-2, 2.460e-2]
        - [2.190e-1, 2.410e-1, 2.440e-1]
    3p-4d:
      wavelength_angstrom: 5686.4
      c_angstrom_cm3: 1.3e+17
      width_angstrom:
        - [2.550e-2, 2.430e-2, 2.260e-2]
