# Resonance lines, then the lines ending on 3p. Upper and lower levels by energy; medium air.
lines:
  - name: D2
    wavelength_nm: 588.995095
    a_ki: 6.160e+07  # s-1, NIST accuracy AA
    lower: {energy_cm1: 0.0, g: 2}
    upper: {energy_cm1: 16973.36619, g: 4}
    self_broadening_cm3_s: 4.67e-07  # Huennekens & Gallagher 1983, +-15 %
    stark: 3s-3p
  - name: D1
    wavelength_nm: 589.592424
    a_ki: 6.140e+07  # s-1, NIST accuracy AA
    lower: {energy_cm1: 0.0, g: 2}
