    self_broadening_cm3_s: 3.07e-07  # Huennekens & Gallagher 1983, +-15 %
    stark: 3s-3p
  # Lines ending on 3p (subordinate lines). self_broadening_cm3_s: the lower level's
  # resonance broadening, D1's constant for 3p1/2 and D2's for 3p3/2 (header).
