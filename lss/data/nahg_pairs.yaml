# Sodium-mercury pairs (NaHg): the curves that set the mercury share of the D lines' far
# wings in an HPS arc (design §4.4, rung 2, second part).
#
# Lower curve, X 2Sigma+ (Na 3s + Hg 6s2 1S0; the only state from two ground-state atoms):
#   L. Thiel, "Theoretische Untersuchungen zur Wechselwirkung und Dynamik in den
#   Stosssystemen Hg + Li, Na, K und Ar*(4s 3P2,0) + Hg, H" (Dissertation, TU
#   Kaiserslautern, 2004; open at kluedo.ub.rptu.de/files/1519), Table D.2: the CCSD(T)
#   curve with Hg described by the pseudopotential PP2, published as L. Thiel, H. Hotop and
#   W. Meyer, J. Chem. Phys. 119, 9008 (2003). Hartree from the 3s + 1S0 asymptote (the
#   table's zero at 45 a0); Re 6.52 a0, De 69 meV (thesis Table 3.13), C6 521 au (Table
#   3.10, against 497-510 au from Stwalley & Kramer 1968). Checked against the page image
#   (2026-10-15): the table crosses zero near 5.52 a0, as the thesis's Table 3.11 states.
#   Beyond 30 a0 the code uses -C6/R^6 (at 30 a0: -7.1e-7 Eh, the table's -7.2e-7); inside
#   4.5 a0 an exponential through the 4.50 and 4.75 a0 values (there the curve is above
#   0.024 Eh, 5400 cm-1, so it weighs at most e^-2 at 4000 K).
#
# Upper curves, as difference potentials (transition energy against R):
#   L. Windholz, G. Zerza, G. Pichler and B. A. Hess, "Visible-laser-induced
#   chemiluminescence of NaHg red excimer bands", Z. Phys. D 18, 373 (1991), Fig. 8:
#   all-electron MRD-CI with spin-orbit coupling (Hund's case c: I 1/2, I 3/2 from A 2Pi,
#   II 1/2 from B 2Sigma+ at short range). Not tabulated, and the paper is not openly
#   available: digitised here (2026-10-15) from a scan of the figure at 300 dpi
#   (scripts/digitise_nahg_curves.py, given a copy of the PDF), calibrated on the frame's
#   ticks (1 px = 17 cm-1, 0.012 a0). The drawn lines are traced and smoothed with a
#   least-squares cubic spline (knots every 0.25 a0) through the trace and the plotted
#   (computed) points, the points weighted 5x; residuals 6-10 cm-1 rms. The points are at
#   R = 4, 5, 5.5, 6, 8, 8.5, 9, 9.5, 10 a0 (circles_cm1, below); up to 8 a0 the curve
#   between them is the authors' drawing. Beyond 8 a0 the drawing has kinks at the avoided
#   crossing (8.5 a0): near-flat stretches, and on I 1/2 a dip of a few cm-1, which the
#   classical sum would turn into spurious satellites (a flat or falling stretch piles the
#   sum up into a spike). The paper states that only II 1/2 - X 1/2 has an
#   extremum (one minimum, here 14 413 cm-1 at 4.75 a0, against the computed point
#   14 473 cm-1 at 4.98 a0), so beyond 8 a0 each curve is a monotone cubic (PCHIP) through
#   the computed points, starting from the drawn line at 8 a0 with its slope. Beyond 8.5 a0 II 1/2 and I 3/2 are
#   drawn as one line and share its points. The grids stop at 9.95 a0 (the last points are
#   at 9.96-9.98 a0).
#   The values are the paper's, in its own energy scale: at 10 a0 they are 600-950 cm-1
#   below the D lines. The paper notes its curves suffer basis-set superposition error
#   (its X well is 0.15 eV, against 0.053 eV measured) and argues the difference potential
#   is little affected. The code shifts all three by one constant (`shift`, below).
#
# Shift: one constant for all three curves (one calculation, one error in the 3p energy),
#   set from long-range physics before the satellite was compared with anything: at 9.95 a0
#   I 3/2 (pure Pi, no avoided crossing) is put at the 3p3/2 asymptote minus Delta C6/R^6,
#   with Delta C6 Unsold's estimate (lss.physics.hid.broadening.unsold_c6, 685 au) times
#   `delta_c6_factor` (1 to 2: Unsold's estimate is known to run about 2x low; design §4.4).
#   That is +478 to +323 cm-1. Beyond 9.95 a0 each curve goes as asymptote - A6/R^6 -
#   A12/R^12, with A6 and A12 set so that value and slope are continuous there (I 3/2 and
#   II 1/2 to 3p3/2, I 1/2 to 3p1/2): a fitted join, not dispersion coefficients, smooth
#   because a slope step would make a step in the classical spectrum.
#   For I 1/2 that join has A6 2.5-3.1 times Unsold's; the code's `tail="dispersion"`
#   alternative (Unsold's dC6 plus the excess fading exponentially) brackets it (design §4.4).
#   Prediction made with this rule, before any comparison (design §4.4): the classical
#   satellite at the II 1/2 minimum, 14 413-14 473 cm-1 plus the shift, is at 668.5-678.3 nm
#   (air), without the digitising error; 668.7-678.4 nm after the change beyond 8 a0 above,
#   which moved I 3/2 at 9.95 a0 by 4 cm-1; 667.8-679.4 nm with +-20 cm-1 for digitising. Measured: 669 nm in absorption (Schlejen, Woerdman & Pichler, J. Mol.
#   Spectrosc. 128, 1 (1988), as quoted by Windholz et al.).
#
# Transition dipoles: not given by the paper beyond one statement, that the A <- X
#   oscillator strength falls by an order of magnitude from 500 to 200 pm (9.45 to 3.78 a0).
#   At long range the three Omega curves share the atomic 3s-3p strength equally (Sigma
#   1/3, Pi 2/3 split between Omega = 1/2 and 3/2): each band takes |D|^2 = d_z^2, with
#   3 d_z^2 fixed by the D lines' A values (lss/data/na_atomic.yaml). `constant` keeps
#   that at every R; `falling` lowers the two I bands' oscillator strength (proportional to
#   transition energy x |D|^2) log-linearly by 10x from 9.45 to 3.78 a0 and keeps II 1/2
#   constant, for which nothing is given. Near the 8.5 a0 avoided crossing the two Omega =
#   1/2 curves would share their strengths differently; that is not modelled. An
#   assumption, reported as a bracket.

source: "Thiel, Hotop & Meyer JCP 119, 9008 (2003) (thesis Table D.2); Windholz, Zerza, Pichler & Hess Z. Phys. D 18, 373 (1991) Fig. 8, digitised 2026-10-15"
