# Sodium-xenon pairs (NaXe): the curves that set the xenon share of the D lines' far wings
# in an HPS arc (design §4.4, rung 2, third part).
#
# Source: E. Galbis, J. Douady, E. Jacquet, E. Giglio and B. Gervais, "Potential energy
#   curves and spin-orbit coupling of light alkali-heavy rare gas molecules", J. Chem.
#   Phys. 138, 014314 (2013). All-electron, BSSE-corrected, scalar-relativistic (DKH):
#   X 2Sigma+ and A 2Pi by CCSD(T), B 2Sigma+ by CASPT2 (the authors call B less accurate
#   than X and A). Spin-free curves, so the upper asymptote is the 3p centroid. Their
#   checks against NaXe spectroscopy: X Re 9.48 a0, De 93.0 cm-1 (measured 100-117); A
#   Re 6.11 a0, De 1094 cm-1 (measured 1120-1215); they estimate De 4-10 % too shallow.
#   The computed values are in the paper's supplement, not used here: read instead
#   (2026-10-17) from the markers of the article's vector figures, Fig. 2 (X) and Fig. 7
#   (A, B), by scripts/digitise_naxe_curves.py given a copy of the PDF, calibrated on the
#   frames' tick marks (the tick labels' centres sit up to 0.6 pt off, 9 cm-1 in Fig. 7).
#   R rounded to the 0.1 a0 grid the markers sit on (0.002-0.008 a0 short of it). Read so:
#   X min -93.0 cm-1 at 9.5 a0 (stated: De 93.0 cm-1, Re 9.48 a0); A min -1094.3 cm-1 at
#   6.1 a0 (stated 1094 cm-1, 6.11 a0).
#
# What the figures do not show, and what stands in:
#   - X inside 8.0 a0: the figure stops at +50 cm-1, but the far red wing comes from
#     6-7 a0, where X is several hundred to a few thousand cm-1. A Tang-Toennies form,
#     A exp(-bR) - sum_n f_2n(bR) C_2n / R^2n (n = 3, 4, 5), with C6 461 au (Mitroy & Zhang,
#     Phys. Rev. A 75, 032706 (2007), as the paper's Table III quotes), C8 30 300 au and
#     C10 = (49/40) C8^2/C6 (Thakkar's rule), C8 set so that C8/R^2 + C10/R^4 at 20 a0 is
#     the paper's 91 au (Table III); A and b fitted to all the X points (rms about 3 cm-1).
#     An extrapolation, not a calculation: `wall` variants refit with C8 25 000 and 50 000
#     au (rms 4.4 and 2.0 cm-1), which move X at 6 a0 by about +-20 %. Between 8.0 and 9.0
#     a0 the form hands over to the points smoothly; beyond 16 a0, -C6/R^6 - C8/R^8 -
#     C10/R^10.
#   - A inside 5.0 a0 and B inside 5.5 a0: an exponential continuing the curve's value and
#     slope at its first point. There X is above 4000 cm-1 (weight e^-1.4 at 4000 K or
#     less), and the transitions fall beyond 760 nm (A) or near the line (B).
#   - A and B beyond 16 a0: asymptote - A6/R^6 - A8/R^8, A6 and A8 set so value and slope
#     are continuous at 16 a0 (a fitted join, not dispersion coefficients).
#
# Transition dipoles: not given by the paper. At long range the 3s-3p strength splits
#   Sigma 1/3, Pi 2/3: X->B takes |D|^2 = d_z^2 and X->A 2 d_z^2, with 3 d_z^2 fixed by
#   the D lines' A values (as for NaHg). Held at every R: an assumption.
#
# Between the points: a monotone cubic (PCHIP) through each curve's points, so the
#   difference potential has no extrema the points do not have (a spurious one would make
#   a spurious satellite in the classical sum).

source: "Galbis, Douady, Jacquet, Giglio & Gervais, J. Chem. Phys. 138, 014314 (2013), Figs. 2 and 7, read from the vector markers 2026-10-17"
dispersion_X_au: {c6: 461.0, c8: 30300.0}
wall_c8_au: {central: 30300.0, soft: 50000.0, hard: 25000.0}
