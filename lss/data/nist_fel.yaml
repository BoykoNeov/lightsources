# Measured spectral irradiance of two 1000 W quartz-halogen lamps (design §11, §15).
#
# Source: NIST Reports of Calibration 39045C, "Spectral Irradiance of Quartz-Halogen
#   Lamp", Osram Sylvania 1000 W lamps, model T6 (modified FEL type, coiled-coil
#   tungsten filament, medium bi-post base), serials F-455 and F-456, submitted by
#   Carl Zeiss; calibration date 1997-02-27; NIST test numbers 844/257096-96-1 and -2.
#   Measured in the NIST FASCAL facility against working standards F-210, F-234 and
#   F-302, on the ITS-90 scale (Walker et al., NBS SP 250-20, 1987).
#   Copy read: https://www.iup.uni-bremen.de/UVSAT_material/technotes/SCIAMACHY_calibration/FEL_NIST_Calibration_Report.pdf
#   (SCIAMACHY calibration technote; scanned report, values transcribed by hand
#   2026-10-14 and checked by the F-456/F-455 ratio, tests/test_nist_fel.py).
# Reuse: the report says it "shall not be reproduced, except in full, without the
#   written approval" of the NIST calibration service. Only the measured values and
#   their uncertainties are kept here, with the full citation; the report itself is
#   not reproduced.
#
# What the data is: absolute spectral irradiance at 50 cm from the lamp, on the axis
#   the spectroradiometer viewed (the side opposite the serial number), operated on
#   DC at 8.200 A. The voltage drop was recorded "for reference only": 109.4 V (F-455)
#   and 109.8 V (F-456), so about 897 W and 900 W. Lamp in its quartz envelope.
#   Unit W/cm^3 is W cm^-2 per cm of wavelength; 1 W/cm^3 = 1e-3 W m^-2 nm^-1.
# Limits:
#   * uneven spacing, 10 nm in the UV, 50-100 nm in the visible, up to 300 nm in the IR:
#     only nine nodes fall within 380-780 nm, so colour numbers depend on how the
#     table is interpolated (lss/accuracy/interpolation.py states and measures this);
#   * one direction only (no angular data), no cold resistance, no filament dimensions;
#   * the two lamps are the same model from the same batch: F-456 checks the
#     transcription and the lamp-to-lamp spread, not a different lamp design.

citation: >-
  NIST Report of Calibration 39045C, Osram Sylvania 1000 W quartz-halogen lamps
  (FEL type) F-455 and F-456, calibrated 1997-02-27 (NIST test 844/257096-96-1, -2)
unit: W cm-3
distance_cm: 50
current_a: 8.200
voltage_v: {F-455: 109.4, F-456: 109.8}

# Its parts (report Table 2, k = 2, per cent; their quadrature sum is line IV.a below, within
# 3 %). Most of it is systematic. The report does not say how any part correlates between
# wavelengths: a systematic part may move the whole curve together (then it barely tests
# shape) or not. The random parts, 0.1-0.2 % in the visible, are what a shape test can lean
# on; the largest visible part, the transfer "model error", decides most of the answer
# (design §4.1 L3; tests/test_nist_fel.py compares the treatments).
uncertainty_components_k2_percent:
  wavelengths_nm: [250, 350, 654.6, 900, 1300, 1600, 2000, 2400]
  parts:
    - {name: "I.a sphere source radiance, with respect to SI", kind: systematic,
       values: [0.91, 0.65, 0.37, 0.33, 0.29, 0.31, 0.48, 0.78]}
    - {name: "II.a radiance-to-irradiance transfer, systematic", kind: systematic,
       values: [0.36, 0.31, 0.27, 0.26, 0.26, 0.25, 0.25, 0.25]}
    - {name: "II.b radiance-to-irradiance transfer, random", kind: random,
       values: [0.30, 0.10, 0.06, 0.56, 0.57, 0.97, 1.73, 3.82]}
    - {name: "II.c radiance-to-irradiance transfer, model error", kind: systematic,
       values: [1.38, 0.80, 0.78, 0.77, 0.77, 0.82, 1.00, 1.20]}
    - {name: "III.a test lamp transfer, systematic", kind: systematic,
       values: [0.01, 0.01, 0.01, 0.01, 0.01, 0.01, 0.01, 0.01]}
    - {name: "III.b test lamp transfer, random", kind: random,
       values: [0.59, 0.16, 0.11, 0.28, 0.45, 0.48, 1.06, 1.73]}

# Relative expanded uncertainty (k = 2) with respect to SI units, per cent (report Table 2,
# line IV.a; the same for both lamps). Between these wavelengths, interpolate linearly.
uncertainty_k2_percent:
  250: 1.82
  350: 1.09
  654.6: 0.91
  900: 1.08
  1300: 1.13
  1600: 1.42
  2000: 2.33
  2400: 4.44

columns: [F-455, F-456]
