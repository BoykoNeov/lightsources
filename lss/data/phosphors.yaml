# Shared phosphor library (design §4.3 L1): emission shapes of the rare-earth
# tri-phosphor blend, shared by every lamp that uses them.
#
# Each phosphor is a set of bands, each a Gaussian in photon energy (split: a separate
# width on each side) with peaks and widths in nm on the energy shape, as in
# lss/physics/led/bands.py. `share` is a band's power relative to the phosphor's main
# band (whose share is 1); a lamp sets each phosphor's total power. Parameter names are
# <phosphor>.<band>.<field>, e.g. LAP.7F6.share.
#
# These are level-1 shapes: tagged empirical, fitted jointly to several CIE lamp tables
# (`lss fit` with several lamps), not measured phosphor spectra. Level 2 replaces them
# with measured excitation and emission spectra.

# References the shared shapes were fitted to. Scores against these are in-sample; the
# accuracy report says so, and the design doc gives the leave-one-out scores.
