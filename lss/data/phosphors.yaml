# LED phosphors (design §4.2 L2): constants of a physical model of each phosphor's
# absorption and emission, read by lss/physics/led/layer.py. Names are
# <phosphor>.<constant>, e.g. garnet.huang_rhys. A lamp sets its own garnet's
# zero-phonon energy (the garnet's composition: Lu, Gd and Ga move the Ce3+ levels) and
# how much of each phosphor its layer holds.
led_phosphors:
  garnet:
    name: (Y,Lu,Gd)3(Al,Ga)5O12:Ce3+
    activator: Ce3+ (5d1 -> 4f, 2F5/2 and 2F7/2)
    fitted_to: [cie-led-b1, cie-led-b2, cie-led-b3, cie-led-b4, cie-led-b5]
    params:
      huang_rhys:
        value: 3.88092
        unit: "1"
        empirical: true
        reason: >-
          fitted by `lss fit` (spectral objective) to cie-led-b1, cie-led-b2, cie-led-b3,
          cie-led-b4, cie-led-b5 jointly on 2026-10-18: NRMS 1.88e-02, du'v' 9.1e-04, dCCT
          +18.90 K (cie-led-b1); NRMS 2.20e-02, du'v' 5.5e-04, dCCT -14.08 K (cie-led-b2);
          NRMS 3.20e-02, du'v' 4.5e-04, dCCT -19.11 K (cie-led-b3); NRMS 5.46e-02, du'v'
          4.0e-04, dCCT -22.48 K (cie-led-b4); NRMS 5.13e-02, du'v' 4.9e-04, dCCT -2.30 K
          (cie-led-b5)
        # YAG:Ce has S ~ 6 with a 200 cm-1 phonon (Bachmann et al., Chem. Mater. 21, 2077 (2009)).
        bounds: [3, 10]
      phonon_energy:
        value: 200
        unit: cm-1
        source: >-
          dominant phonon coupled to the Ce3+ 5d1 level in YAG:Ce, from its vibronic
          structure (Bachmann, Ronda, Meijerink, Chem. Mater. 21, 2077 (2009))
      inhomogeneous_fwhm:
        value: 2602.42
        unit: cm-1
        empirical: true
        reason: >-
          fitted by `lss fit` (spectral objective) to cie-led-b1, cie-led-b2, cie-led-b3,
          cie-led-b4, cie-led-b5 jointly on 2026-10-18: NRMS 1.88e-02, du'v' 9.1e-04, dCCT
          +18.90 K (cie-led-b1); NRMS 2.20e-02, du'v' 5.5e-04, dCCT -14.08 K (cie-led-b2);
          NRMS 3.20e-02, du'v' 4.5e-04, dCCT -19.11 K (cie-led-b3); NRMS 5.46e-02, du'v'
          4.0e-04, dCCT -22.48 K (cie-led-b4); NRMS 5.13e-02, du'v' 4.9e-04, dCCT -2.30 K
          (cie-led-b5)
        # Site-to-site spread of a concentrated, mixed-cation powder.
        bounds: [0, 4500]
      ground_splitting:
        value: 3200
        unit: cm-1
        empirical: true
        reason: >-
          fitted by `lss fit` (spectral objective) to cie-led-b1, cie-led-b2, cie-led-b3,
          cie-led-b4, cie-led-b5 jointly on 2026-10-18: NRMS 1.88e-02, du'v' 9.1e-04, dCCT
          +18.90 K (cie-led-b1); NRMS 2.20e-02, du'v' 5.5e-04, dCCT -14.08 K (cie-led-b2);
          NRMS 3.20e-02, du'v' 4.5e-04, dCCT -19.11 K (cie-led-b3); NRMS 5.46e-02, du'v'
          4.0e-04, dCCT -22.48 K (cie-led-b4); NRMS 5.13e-02, du'v' 4.9e-04, dCCT -2.30 K
          (cie-led-b5)
        # 2F5/2 to 2F7/2: ~2250 cm-1 in the free Ce3+ ion; the crystal field spreads the 2F7/2 levels upward.
        bounds: [1500, 3200]
      ratio_2f7_2f5:
        value: 0.1
        unit: "1"
        empirical: true
        reason: >-
          fitted by `lss fit` (spectral objective) to cie-led-b1, cie-led-b2, cie-led-b3,
          cie-led-b4, cie-led-b5 jointly on 2026-10-18: NRMS 1.88e-02, du'v' 9.1e-04, dCCT
          +18.90 K (cie-led-b1); NRMS 2.20e-02, du'v' 5.5e-04, dCCT -14.08 K (cie-led-b2);
          NRMS 3.20e-02, du'v' 4.5e-04, dCCT -19.11 K (cie-led-b3); NRMS 5.46e-02, du'v'
          4.0e-04, dCCT -22.48 K (cie-led-b4); NRMS 5.13e-02, du'v' 4.9e-04, dCCT -2.30 K
          (cie-led-b5)
        bounds: [0.1, 2]
      # Thermal quenching (Level 3, lss/physics/led/thermal.py): a yield 1/(1 + C exp(-dE/kT)),
      # with C set by the fraction kept at 150 C against 25 C.
      quench_retained_423k:
        value: 0.903
        unit: "1"
        source: >-
          Y2.94Al4GaO12:Ce3+ powder keeps 90.3 % of its 25 C emission at 150 C (Qiang, Yu, Chen,
          Fang, Ceram. Int. 42, 767 (2016)). A Ga-substituted YAG, standing in for every
          garnet here: the warm CIE LEDs' fitted garnets are greener than YAG, and Ga lowers the
          quenching temperature; YAG itself quenches near 600 K (Ueda et al., J. Phys. Chem. C
          119, 25003 (2015)), so it keeps more at 150 C than this.
      quench_activation_energy:
        value: 0.3
        unit: eV
        empirical: true
        reason: >-
          assumed: the source gives only the fraction kept at 150 C, and the barrier sets the
          curve's shape between. Thermal ionisation of Ce3+ in YAG needs more (it sets in near
          600 K), but concentration quenching in LED powders acts lower; how the choice moves
          Level 3's colour is in the design doc (§4.2 L3).
