# Reference spectra library (design §11). Level 0 of every lamp family draws from here,
# and the accuracy report scores every other level against these entries.
#
# Fields
#   id           stable identifier used by lamp presets and the CLI (ref:<id>)
#   family       incandescent | fluorescent | hid | led
#   description  what the spectrum represents
#   source       where the numbers come from; type colour-science reads the named
#                dataset shipped with the colour-science package (no copied data)
#   kind         representative-table | definition | measurement
#   sampling_nm  spacing of the table. Features narrower than about twice this
#                (HPS self-reversal, line shapes) are NOT checked by this reference.
#   bandpass_nm  FWHM of the triangular bandpass the table was recorded with, or null
#                when no instrument blurred it (a definition). Before scoring, a model
#                is sampled the same way, so its lines spread over neighbouring
#                nodes exactly as the lamp's did in the table.
#   uncertainty  stated measurement uncertainty, or "not stated"
#   includes     components already folded into the spectrum
#                (phosphor, envelope, reflector, luminaire)
#   citation     publication
#
# The CIE 15:2018 tables are starters: typical examples, relative, 5 nm, mostly
# 380-780 nm, not measurements of a specific lamp. Fine for chromaticity, CCT and
# colour rendering; too coarse for line-shape physics (roadmap step 3 needs real,
# finely resolved measurements, see the design's open questions).

defaults:
  kind: representative-table
  sampling_nm: 5
  # Assumed: CIE 15 does not state it, but a triangle of FWHM equal to the step is the
  # usual spectroradiometer setting, and the FL11 table bears it out. Above a straight
  # background, the Hg 435.83 nm line puts 0.21 of its 435 nm value on the 440 nm node
  # and nothing on 430 nm (a 5 nm triangle predicts 0.20 and 0; a 7.5 nm one 0.50 and
  # 0.25). The 404.66 nm line: 0.05 on 400 nm, 0.01 on 410 nm (5 nm: 0.07, 0).
  bandpass_nm: 5
  uncertainty: not stated
  citation: "CIE 15:2018 Colorimetry, 4th ed. (via colour-science SDS_ILLUMINANTS)"

references:
  - id: cie-a
    family: incandescent
    description: CIE Illuminant A, representing a gas-filled tungsten lamp (Planck at 2856 K)
    source: {type: colour-science, key: A}
    kind: definition
    bandpass_nm: null  # Planck's law at 2856 K: no instrument blurred it
    uncertainty: exact by definition
    citation: "CIE 15:2018; ISO 11664-2 (via colour-science SDS_ILLUMINANTS)"
    includes: []

  # Fluorescent: halophosphate (FL1-FL6), broadband (FL7-FL9), three-band (FL10-FL12)
  - {id: cie-fl1, family: fluorescent, description: "CIE FL1, standard halophosphate (daylight)", source: {type: colour-science, key: FL1}, includes: [phosphor, envelope]}
  - {id: cie-fl2, family: fluorescent, description: "CIE FL2, standard halophosphate (cool white)", source: {type: colour-science, key: FL2}, includes: [phosphor, envelope]}
  - {id: cie-fl3, family: fluorescent, description: "CIE FL3, standard halophosphate (white)", source: {type: colour-science, key: FL3}, includes: [phosphor, envelope]}
  - {id: cie-fl4, family: fluorescent, description: "CIE FL4, standard halophosphate (warm white)", source: {type: colour-science, key: FL4}, includes: [phosphor, envelope]}
  - {id: cie-fl5, family: fluorescent, description: "CIE FL5, standard halophosphate (daylight)", source: {type: colour-science, key: FL5}, includes: [phosphor, envelope]}
  - {id: cie-fl6, family: fluorescent, description: "CIE FL6, standard halophosphate (lite white)", source: {type: colour-science, key: FL6}, includes: [phosphor, envelope]}
  - {id: cie-fl7, family: fluorescent, description: "CIE FL7, broadband (D65 simulator)", source: {type: colour-science, key: FL7}, includes: [phosphor, envelope]}
  - {id: cie-fl8, family: fluorescent, description: "CIE FL8, broadband (D50 simulator)", source: {type: colour-science, key: FL8}, includes: [phosphor, envelope]}
  - {id: cie-fl9, family: fluorescent, description: "CIE FL9, broadband (cool white deluxe)", source: {type: colour-science, key: FL9}, includes: [phosphor, envelope]}
  - {id: cie-fl10, family: fluorescent, description: "CIE FL10, three-band (rare-earth tri-phosphor)", source: {type: colour-science, key: FL10}, includes: [phosphor, envelope]}
  - {id: cie-fl11, family: fluorescent, description: "CIE FL11, three-band (rare-earth tri-phosphor)", source: {type: colour-science, key: FL11}, includes: [phosphor, envelope]}
