[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "lss"
version = "0.1.0"
description = "Light source simulator: physics-first spectral models of lamps"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.0",
    "scipy>=1.13",
    "colour-science>=0.4.6",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "openpyxl>=3.1"]
# Reading downloaded measurement data (`lss leddrive`).
data = ["openpyxl>=3.1"]
# The renderer (Mitsuba 3 spectral variants; design doc §8).
render = ["mitsuba==3.9.1"]
# The viewer (design §9.7): Qt essentials only (no web engine) and pyqtgraph.
ui = ["PySide6-Essentials==6.12.0", "pyqtgraph==0.14.0"]

[project.scripts]
lss = "lss.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["lss"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Renderer tests (design §12) are slower and need the 'render' extra: run them with -m render.
addopts = "-m 'not render and not ui'"
markers = [
    "render: needs Mitsuba; left out of the default run (pytest -m render)",
    "ui: needs PySide6; opens the viewer offscreen; left out of the default run (pytest -m ui)",
]
filterwarnings = [
    # colour-science: matplotlib-absent notice (plotting is unused) and its notices
    # when it resamples a table to the shape a metric needs.
    "ignore:.*Matplotlib.*:Warning",
    "ignore:Aligning .*:Warning",
]
